# 預設密碼只供本機開發；正式環境一律用 .env 覆寫（見 .env.example）
services:
  mysql:
    build: ./db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dev-root-pw}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:-dev-booking-pw}
      DISPATCH_DB_PASSWORD: ${DISPATCH_DB_PASSWORD:-dev-dispatch-pw}
      TZ: Asia/Taipei
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  booking-service:
    build: ./booking-service
    environment:
      DB_URL: jdbc:mysql://mysql:3306/booking_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Taipei
      DB_USER: booking
      TZ: Asia/Taipei
      DB_PASSWORD: ${BOOKING_DB_PASSWORD:-dev-booking-pw}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  dispatch-service:
    build: ./dispatch-service
    environment:
      DB_URL: jdbc:mysql://mysql:3306/dispatch_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Taipei
      DB_USER: dispatch
      TZ: Asia/Taipei
      DB_PASSWORD: ${DISPATCH_DB_PASSWORD:-dev-dispatch-pw}
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mysql-data:
