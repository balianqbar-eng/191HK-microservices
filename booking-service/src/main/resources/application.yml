server:
  port: 8081

spring:
  application:
    name: booking-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/booking_db}
    username: ${DB_USER:booking}
    password: ${DB_PASSWORD:dev-booking-pw}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      platform: mysql

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
